<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="/favicon.png" />
  <title id="t">404 - Not Found</title>
  
  <link rel="stylesheet" href="/assets/css/global.css?v=6" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=01" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    /* 背景を真っ黒に固定 */
    body {
      background-color: #000 !important;
      background-image: none !important; /* 背景画像が干渉しないように */
      color: #fff !important;
      margin: 0;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column; /* 上下に分ける */
      overflow: hidden;
    }

    /* ナビゲーションバーの設定（透過させて浮かせる） */
    .f-nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.5) !important;
      backdrop-filter: blur(10px);
    }

    /* メインコンテンツを画面のど真ん中に配置 */
    .main.error {
      flex: 1; /* 残りの画面いっぱいを使う */
      display: flex;
      flex-direction: column;
      justify-content: center; /* 垂直方向中央 */
      align-items: center;     /* 水平方向中央 */
      text-align: center;
      padding-top: 60px; /* ナビバーに被らないように余白を追加 */
    }

    h1 {
      font-size: clamp(80px, 15vw, 150px); /* 画面サイズに合わせて可変 */
      margin: 0;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
    }

    h3 {
      font-size: 16px;
      font-weight: 300;
      margin: 10px 0 30px 0;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    button.one {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 15px 40px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      outline: none;
    }

    button.one:hover {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    /* ナビゲーション内のSettings以外を隠す */
    .f-nav-right .navbar-link {
      display: none !important;
    }
    .f-nav-right .navbar-link:last-child {
      display: inline-flex !important;
      color: #fff !important;
    }
  </style>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6840529569014734"
    crossorigin="anonymous"></script>
</head>

<body>
  <div class="f-nav"></div>
  
  <div class="main error">
    <h1>404</h1>
    <h3>このページは見つかりませんでした</h3>
    <button class="one" type="button" onclick="window.location.href = '/';">
      ホームに戻る
    </button>
  </div>
</body>

<script src="/assets/js/index-3.js"></script>

<script src="/assets/mathematics/config.js?v=2025-04-15"></script>

</html>
